services:
  whoknows_flask:
    image: ghcr.io/who-knows-inc/whoknows_variations_server:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "8080:8080"

  whoknows_nginx:
    image: ghcr.io/who-knows-inc/whoknows_variations_nginx:latest
    build:
      context: ./network
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - whoknows_flask
